[project]
name = "msrl"
version = "0.1.0"
description = "Reinforcement learning agents for Minesweeper"
requires-python = ">=3.11"
dependencies = ["numpy", "torch"]

[dependency-groups]
dev = [
    "onnx>=1.23.2",
    "onnxruntime>=1.32.0",
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["msrl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
